*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9edf3;color:#111}
.app{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px #0002}

label{display:block;font-size:12px;color:#555;margin:8px 0 2px}
input,select,textarea{width:100%;padding:7px;border:1px solid #bbb;border-radius:6px;font:inherit;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:#1d3a8a;color:#fff;border:0;border-radius:6px;padding:9px 14px;margin:10px 6px 0 0;cursor:pointer;font-size:13px}

.wrap{overflow-x:auto}

.kop .al{text-decoration:underline}

.jd{text-align:center;margin:0}

.nm{text-align:center;margin-bottom:12px;text-decoration:none !important}

.ttd{width:100%;border-collapse:collapse;margin-top:6px}

.sigw{position:relative;left:-7mm}
.sp{height:78px;position:relative}
.sa{position:relative;height:28mm}

.sp .sg{max-height:26mm;max-width:46mm}
.sa .kap{height:28mm;max-height:none}
.st{position:absolute;left:50%;top:50%;width:29mm;transform:translate(-105%,-55%);opacity:.92;mix-blend-mode:multiply}
.mg{text-align:center;margin-top:14px}
.nav{padding:12px 16px 0}.nav button{margin:0 6px 0 0}
#varsip{margin:16px;padding:14px}
.at{width:100%;border-collapse:collapse;font-size:13px}.at th,.at td{border-bottom:1px solid #e1e5ee;padding:7px 6px;text-align:left;vertical-align:top}
.at th{background:#f2f5fb;color:#1d3a8a}
.at button{margin:2px 3px 2px 0;padding:5px 9px;font-size:12px}
.ok{color:#128a3d;font-weight:bold}.no{color:#b3261e}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar input{width:260px}.bar button{margin:0}
#msg{font-size:12px;color:#128a3d;margin-top:8px;min-height:16px}
